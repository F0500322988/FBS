name: macOS and iMac M179 preview
on:
  push:
    branches: ['build/m175-macos', 'build/m175-macos-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    if: ${{ !contains(github.ref, '-arm-') }}
    runs-on: macos-26-intel
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - name: Shared JavaScript and real local TLS tests
        run: node --test tests/*.test.js
      - name: Build universal teacher and student applications, PKG and DMG
        run: |
          set +e
          FBS_MAC_INSTALL_SMOKE=1 bash macos/build.sh "$RUNNER_TEMP/fbs-m179-macos-output" > "$RUNNER_TEMP/fbs-m179-build.log" 2>&1
          fbs_build_status=$?
          set -e
          cat "$RUNNER_TEMP/fbs-m179-build.log"
          if [ "$fbs_build_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/fbs-m179-build.log" <<'PYTHON'
          import pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          selected=[line for line in lines if 'error:' in line or 'fatal error:' in line]
          if not selected:selected=lines[-15:]
          for line in selected[:20]:
              print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYTHON
          fi
          exit "$fbs_build_status"
      - uses: actions/upload-artifact@v4
        with:
          name: FBS-Classroom-M179-macOS-Universal-Preview
          path: |
            ${{ runner.temp }}/fbs-m179-macos-output/*.json
            ${{ runner.temp }}/fbs-m179-macos-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable development preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fbs_release_tag="m179-macos-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$fbs_release_tag" \
            --target "$GITHUB_SHA" --prerelease \
            --title "FBS Classroom M179 — macOS / iMac — Intel + Apple Silicon" \
            --notes-file M179-START-HERE.md \
            "$RUNNER_TEMP"/fbs-m179-macos-output/*.pkg \
            "$RUNNER_TEMP"/fbs-m179-macos-output/*.dmg \
            "$RUNNER_TEMP"/fbs-m179-macos-output/*.json \
            "$RUNNER_TEMP"/fbs-m179-macos-output/SHA256SUMS.txt
