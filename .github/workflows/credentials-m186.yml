name: M186 three to eight digit credentials and installers
on:
  push:
    branches: ['build/m186-pin-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-helper:
    runs-on: macos-26-intel
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build Universal setup helper and test three to eight digit Keychain profile
        run: |
          bash deployment/m184/build-mac.sh "$RUNNER_TEMP/m186-helper"
          xcrun swiftc -swift-version 5 macos/Sources/ConnectionConfig.swift macos/Tests/ConfigTests.swift -o "$RUNNER_TEMP/config-tests"
          "$RUNNER_TEMP/config-tests" | tee "$RUNNER_TEMP/m186-helper/swift-config-tests.json"
          shasum -a 256 "$RUNNER_TEMP/m186-helper/FBS-LabSetup-Mac" > "$RUNNER_TEMP/m186-helper/helper-sha256.txt"
      - name: Publish tested setup helper for dependent builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "m186-mac-helper-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'M186 Universal Mac setup helper — three to eight digit fixture tested' --notes-file M186-START-HERE.md "$RUNNER_TEMP"/m186-helper/*
  windows-build:
    needs: mac-helper
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Shared runtime regression suite including three to eight digit TLS and login
        run: node --test tests/*.test.js
      - name: Download helper built from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/mac-helper"
          gh release download "m186-mac-helper-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" --repo "$GITHUB_REPOSITORY" --pattern FBS-LabSetup-Mac --dir "$RUNNER_TEMP/mac-helper"
      - name: Rebuild native apps and Windows setup helper; stage current shared runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          FBS_BUILD_CURRENT_CORE=1 FBS_CURRENT_MAC_HELPER="$RUNNER_TEMP/mac-helper/FBS-LabSetup-Mac" python3 deployment/integrated/stage-windows.py "$RUNNER_TEMP/M186-integrated"
      - name: Build and verify both installers
        run: |
          FBS_RELEASE_STAGE=M186 bash windows/nsis/build-linux.sh "$RUNNER_TEMP/M186-integrated/stage" "$RUNNER_TEMP/M186-integrated/installers" > "$RUNNER_TEMP/m186-nsis.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/m186-nsis.log"; exit 1; }
          cp "$RUNNER_TEMP"/M186-integrated/stage/payload-*.json "$RUNNER_TEMP/M186-integrated/installers/"
          cp "$RUNNER_TEMP/M186-integrated/current-windows-helper/FBS.LabSetup.exe" "$RUNNER_TEMP/M186-integrated/installers/FBS-LabSetup-Windows.exe"
      - name: Create draft candidate pending Windows installation checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "m186-windows-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --draft --title 'M186 Windows — awaiting installed checks' --notes-file M186-START-HERE.md "$RUNNER_TEMP"/M186-integrated/installers/*.exe "$RUNNER_TEMP"/M186-integrated/installers/*.json
  windows-installed:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Native Windows regression suite including three to eight digit DPAPI round trips
        shell: pwsh
        run: ./deployment/integrated/test-core-windows.ps1 -ReportDirectory "$env:RUNNER_TEMP/M186-integrated/installers"
      - name: Fetch exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "m186-windows-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --pattern '*.json' --dir "$RUNNER_TEMP/M186-integrated/installers"
      - name: Install both roles and execute embedded three to eight digit provisioning fixtures
        shell: pwsh
        run: ./deployment/integrated/test-installed-windows.ps1 -BuildRoot "$env:RUNNER_TEMP/M186-integrated"
      - name: Publish checked installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./deployment/integrated/publish-windows.ps1 -ReleaseTag "m186-windows-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT" -BuildRoot "$env:RUNNER_TEMP/M186-integrated" -NotesFile M186-START-HERE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
  mac-installers:
    needs: windows-installed
    runs-on: macos-26-intel
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - name: Download Windows helper checked on Windows from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/windows-helper"
          gh release download "m186-windows-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" --repo "$GITHUB_REPOSITORY" --pattern FBS-LabSetup-Windows.exe --dir "$RUNNER_TEMP/windows-helper"
      - name: Build current Universal apps and both installers with freshly rebuilt helpers
        run: |
          FBS_CURRENT_WINDOWS_HELPER="$RUNNER_TEMP/windows-helper/FBS-LabSetup-Windows.exe" FBS_MAC_INSTALL_SMOKE=1 bash macos/build.sh "$RUNNER_TEMP/m186-mac"
      - name: Publish macOS Intel and Apple Silicon packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "m186-macos-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'M186 macOS / iMac — three to eight digit setup — Intel + Apple Silicon' --notes-file M186-START-HERE.md "$RUNNER_TEMP"/m186-mac/*.pkg "$RUNNER_TEMP"/m186-mac/*.dmg "$RUNNER_TEMP"/m186-mac/*.json "$RUNNER_TEMP"/m186-mac/*.log "$RUNNER_TEMP/m186-mac/SHA256SUMS.txt"
