name: macOS M180 Apple Silicon build and preview
on:
  push:
    branches: ['build/m175-macos-m177-arm-*', 'build/m175-macos-m178-arm-*', 'build/m175-macos-m179-arm-*', 'build/m175-macos-m180-arm-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - name: Shared JavaScript and real TLS checks on Apple Silicon
        run: node --test tests/*.test.js
      - name: Universal apps, native runtime, file save, installed PKG and DMG checks
        run: |
          set +e
          FBS_MAC_INSTALL_SMOKE=1 bash macos/build.sh "$RUNNER_TEMP/fbs-m180-arm-output" > "$RUNNER_TEMP/fbs-m180-arm-build.log" 2>&1
          fbs_build_status=$?
          set -e
          cat "$RUNNER_TEMP/fbs-m180-arm-build.log"
          if [ "$fbs_build_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/fbs-m180-arm-build.log" <<'PYTHON'
          import pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          selected=[line for line in lines if 'error:' in line or 'fatal error:' in line]
          if not selected:selected=lines[-8:]
          for line in selected[-8:]:
              print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYTHON
          fi
          exit "$fbs_build_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FBS-M180-Apple-Silicon-validation
          path: |
            ${{ runner.temp }}/fbs-m180-arm-output/*.json
            ${{ runner.temp }}/fbs-m180-arm-output/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Publish universal preview built and checked on Apple Silicon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fbs_release_tag="m180-macos-arm-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$fbs_release_tag" \
            --target "$GITHUB_SHA" --prerelease \
            --title "FBS Classroom M180 — macOS / iMac — Universal — Apple Silicon validated" \
            --notes-file M180-START-HERE.md \
            "$RUNNER_TEMP"/fbs-m180-arm-output/*.pkg \
            "$RUNNER_TEMP"/fbs-m180-arm-output/*.dmg \
            "$RUNNER_TEMP"/fbs-m180-arm-output/*.json \
            "$RUNNER_TEMP"/fbs-m180-arm-output/SHA256SUMS.txt
