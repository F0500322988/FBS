name: macOS M177 Apple Silicon validation
on:
  push:
    branches: ['build/m175-macos-m177-arm-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - name: Persistent lab settings on Apple Silicon
        run: node --test tests/m177-lab-settings.test.js tests/m177-lab-api.test.js
      - name: Universal apps, native runtime, file save, installed PKG and DMG checks
        run: |
          set +e
          FBS_MAC_INSTALL_SMOKE=1 bash macos/build.sh "$RUNNER_TEMP/fbs-m177-arm-output" > "$RUNNER_TEMP/fbs-m177-arm-build.log" 2>&1
          fbs_build_status=$?
          set -e
          cat "$RUNNER_TEMP/fbs-m177-arm-build.log"
          if [ "$fbs_build_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/fbs-m177-arm-build.log" <<'PYTHON'
          import pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          selected=[line for line in lines if 'error:' in line or 'fatal error:' in line]
          if not selected:selected=lines[-15:]
          for line in selected[:20]:
              print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYTHON
          fi
          exit "$fbs_build_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FBS-M177-Apple-Silicon-validation
          path: |
            ${{ runner.temp }}/fbs-m177-arm-output/*.json
            ${{ runner.temp }}/fbs-m177-arm-output/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
