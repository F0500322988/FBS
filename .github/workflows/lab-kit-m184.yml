name: M184 lab setup kit
on:
  push:
    branches: ['build/windows-m176-checks-m184-kit-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-kit:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Compile portable setup helper and test real DPAPI with fixture state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish windows/FBS.LabSetup/FBS.LabSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$env:RUNNER_TEMP/lab-kit-windows"
          if ($LASTEXITCODE -ne 0) { throw 'Helper publish failed.' }
          & "$env:RUNNER_TEMP/lab-kit-windows/FBS.LabSetup.exe" self-test | Tee-Object "$env:RUNNER_TEMP/lab-kit-windows/Windows-provisioning-checks.log"
          if ($LASTEXITCODE -ne 0) { throw 'Provisioning checks failed.' }
          foreach ($name in @('Prepare-Teacher-Windows.cmd','Setup-Student-Windows.cmd')) { if (-not (Test-Path "deployment/m184/$name")) { throw 'Missing launcher' } }
      - name: Publish Windows helper and fixture evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fbs_tag="m184-windows-kit-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cp "$RUNNER_TEMP/lab-kit-windows/FBS.LabSetup.exe" "$RUNNER_TEMP/lab-kit-windows/FBS-LabSetup-Windows.exe"
          gh release create "$fbs_tag" "$RUNNER_TEMP/lab-kit-windows/FBS-LabSetup-Windows.exe" "$RUNNER_TEMP/lab-kit-windows/Windows-provisioning-checks.log" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'M184 Windows setup helper — fixture tested' --notes 'Self-contained unsigned Windows helper. No real lab profile, key or teacher password is included. Requires installed M183 for application import. Tests use temporary fixture state and do not operate user devices.'
  mac-kit:
    needs: windows-kit
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build both architectures and test isolated real Keychain fixtures
        shell: bash
        run: bash deployment/m184/build-mac.sh "$RUNNER_TEMP/lab-kit-mac"
      - name: Assemble cross-platform public kit without lab secrets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fbs_windows_tag="m184-windows-kit-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release download "$fbs_windows_tag" --repo "$GITHUB_REPOSITORY" --pattern FBS-LabSetup-Windows.exe --pattern Windows-provisioning-checks.log --dir "$RUNNER_TEMP/lab-kit-mac"
          python3 deployment/m184/package-kit.py "$RUNNER_TEMP/lab-kit-mac"
      - name: Publish setup kit and evidence directly as release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FBS_KIT_HOST: ${{ matrix.os }}
        run: |
          set -euo pipefail
          fbs_tag="m184-lab-kit-${FBS_KIT_HOST}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$fbs_tag" "$RUNNER_TEMP/lab-kit-mac/FBS-Classroom-M184-Lab-Setup-Kit.zip" "$RUNNER_TEMP/lab-kit-mac/SHA256SUMS.txt" "$RUNNER_TEMP/lab-kit-mac/Mac-provisioning-checks.log" "$RUNNER_TEMP/lab-kit-mac/Windows-provisioning-checks.log" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "M184 lab setup kit — checked on $FBS_KIT_HOST" --notes 'Cross-platform configuration helper for existing M183 installers. Windows x64 and Mac Intel/Apple Silicon. Public kit has NO real lab key/profile. Export a private student kit locally on the teacher account; run student setup under the student account, then approve each device from the teacher. macOS permissions remain local. Windows unsigned, Mac ad-hoc signed. CI uses isolated DPAPI/Keychain fixtures, not real classroom devices.'
